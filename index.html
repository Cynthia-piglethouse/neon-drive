<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>夜行 · NEON DRIVE</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080b16;color:#edf5ff;font-family:system-ui,"Microsoft YaHei",sans-serif;min-height:100svh;display:grid;place-items:center;background-image:radial-gradient(ellipse at 15% 20%,#122c3f 0,transparent 48%),radial-gradient(ellipse at 90% 90%,#251638 0,transparent 45%)}main{width:min(1080px,96vw);display:grid;grid-template-columns:1fr 440px;gap:70px;align-items:center;padding:24px}small,.eyebrow{letter-spacing:4px;color:#6de9e0;font-size:11px}h1{font-size:70px;line-height:1.1;margin:22px 0;font-weight:850;letter-spacing:-3px}h1 span{display:block;font-size:23px;letter-spacing:8px;color:#aab7d0;margin-top:18px}p{color:#9caac3;font-size:15px;line-height:1.9}.tag{display:inline-block;border:1px solid #29414f;border-radius:30px;padding:7px 12px;color:#6de9e0;font-size:12px;margin:22px 0}.instructions{border-top:1px solid #263042;margin-top:25px;padding-top:20px;font-size:13px;color:#aab7d0;line-height:2.5}kbd{background:#1b2436;border:1px solid #364058;border-radius:5px;padding:3px 7px;color:white}footer{font-size:10px;letter-spacing:2px;color:#53637b;margin-top:35px}.game{width:100%;max-width:440px;margin:auto}.stats{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.metric label{display:block;font-size:10px;letter-spacing:2px;color:#8a9bb5;margin-bottom:4px}.metric b{font-size:24px;font-variant-numeric:tabular-nums}.metric:first-child b{color:#6de9e0}button{font:inherit;cursor:pointer;border:1px solid #35445a;border-radius:10px;color:#deebff;background:#192235;padding:10px 16px;touch-action:manipulation}button:hover{background:#28384a}button:focus-visible{outline:3px solid #6de9e0;outline-offset:3px}.stage{position:relative;overflow:hidden;border:1px solid #374558;border-radius:20px;box-shadow:0 24px 90px #0008}canvas{width:100%;display:block;aspect-ratio:420/600;touch-action:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#080e1aab;backdrop-filter:blur(5px);text-align:center;padding:30px}.overlay.hidden{display:none}.overlay h2{font-size:32px;margin:15px 0 8px}.overlay p{font-size:13px;margin-bottom:24px}.primary{border:0;background:#72f0dc;color:#0a2530;font-weight:750;padding:15px 35px;box-shadow:0 4px 30px #6de9e028}.primary:hover{background:#a1ffec}.symbol{font-size:40px;color:#72f0dc}.controls{display:flex;gap:12px;margin-top:13px}.controls button{flex:1;font-size:22px;user-select:none;-webkit-user-select:none;touch-action:none}.bottom{display:flex;justify-content:space-between;margin-top:12px;color:#647892;font-size:11px}.live{color:#6de9e0} @media(max-width:800px){main{grid-template-columns:1fr;gap:20px;padding:16px;max-width:480px}.intro h1{font-size:30px;margin:0;letter-spacing:0}.intro h1 span{font-size:12px;display:inline;margin-left:12px;letter-spacing:3px}.intro .eyebrow,.intro p,.tag,.instructions,footer{display:none}.stats{margin-top:4px}.stage{max-height:68svh}canvas{max-height:68svh}.metric b{font-size:20px}}
</style></head>
<body><main><section class="intro"><div class="eyebrow">AFTER HOURS / ARCADE 01</div><h1>夜行<span>NEON DRIVE</span></h1><p>灯光向后，注意力向前。<br>驾驶你的跑车穿过夜色，<br>避开车流与路障，刷新最远纪录。</p><div class="tag">无限公路 · 反应挑战</div><div class="instructions"><kbd>←</kbd> <kbd>→</kbd> 或 <kbd>A</kbd> <kbd>D</kbd> 左右驾驶<br><kbd>Space</kbd> 暂停 / 继续<br>手机按住下方方向键，也可在路面拖动</div><footer>STAY FOCUSED. KEEP DRIVING.</footer></section><section class="game" aria-label="驾驶躲避游戏"><div class="stats"><div class="metric"><label>本次得分</label><b id="score">0000</b></div><div class="metric"><label>最高纪录</label><b id="best">0000</b></div><button id="pause" aria-label="暂停或继续游戏">暂停</button></div><div class="stage"><canvas id="road" width="420" height="600" aria-label="使用左右方向键驾驶，躲避车辆和路障"></canvas><div class="overlay" id="overlay"><div><div class="symbol">◇</div><small id="overline">READY FOR THE NIGHT</small><h2 id="title">驶入夜色</h2><p id="message">避开车辆与路障，保持前行。<br>速度会逐渐提升，你能开多远？</p><button class="primary" id="start">开始驾驶 →</button></div></div></div><div class="controls"><button id="left" aria-label="向左驾驶">←</button><button id="right" aria-label="向右驾驶">→</button></div><div class="bottom"><span class="live" id="speed">● 引擎待命</span><span>离线可玩 / 自动记录最高分</span></div></section></main>
<script>
(()=>{'use strict';
const canvas=document.getElementById('road'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id),W=420,H=600,keys=new Set();
let state='ready',player={x:210,y:491,w:36,h:68},obstacles=[],particles=[],distance=0,elapsed=0,spawn=0,offset=0,last=0,best=0,drag=false;
try{best=Number(localStorage.getItem('neon-drive-best'))||0}catch(e){}$('best').textContent=String(best).padStart(4,'0');
const lanes=[100,210,320];
function rounded(x,y,w,h,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function car(x,y,w,h,color,own=false){ctx.save();ctx.translate(x,y);ctx.shadowBlur=own?20:8;ctx.shadowColor=color;rounded(-w/2,-h/2,w,h,9,color);ctx.shadowBlur=0;rounded(-w/2+5,-h/2+15,w-10,h*.29,4,'#112434');rounded(-w/2+6,h/2-19,w-12,11,3,'#152839');ctx.fillStyle='#ffffffaa';ctx.fillRect(-2,-h/2+3,4,10);ctx.fillStyle='#d6fff7';ctx.fillRect(-w/2+3,-h/2+3,7,4);ctx.fillRect(w/2-10,-h/2+3,7,4);ctx.fillStyle='#ff617c';ctx.fillRect(-w/2+3,h/2-6,7,3);ctx.fillRect(w/2-10,h/2-6,7,3);if(own){let g=ctx.createLinearGradient(0,-h/2,0,-160);g.addColorStop(0,'#83fff92b');g.addColorStop(1,'#83fff900');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(-15,-h/2);ctx.lineTo(-50,-160);ctx.lineTo(50,-160);ctx.lineTo(15,-h/2);ctx.fill()}ctx.restore()}
function draw(){ctx.fillStyle='#101929';ctx.fillRect(0,0,W,H);ctx.fillStyle='#192335';ctx.fillRect(45,0,330,H);for(let x of [45,375]){ctx.fillStyle='#5bdccb';ctx.shadowColor='#5bdccb';ctx.shadowBlur=12;ctx.fillRect(x,0,2,H)}ctx.shadowBlur=0;ctx.fillStyle='#a9bed143';for(let y=-90+offset%90;y<H;y+=90){ctx.fillRect(154,y,2,44);ctx.fillRect(264,y,2,44)}for(let y=-100+offset%100;y<H;y+=100){rounded(18,y,7,27,2,'#55b6bd');rounded(395,y,7,27,2,'#9874ba')}for(const o of obstacles){if(o.type==='car')car(o.x,o.y,o.w,o.h,o.color);else{rounded(o.x-o.w/2,o.y-o.h/2,o.w,o.h,5,'#fca65e');ctx.save();ctx.beginPath();ctx.rect(o.x-o.w/2+3,o.y-o.h/2+3,o.w-6,o.h-6);ctx.clip();ctx.strokeStyle='#473042';ctx.lineWidth=10;for(let x=o.x-50;x<o.x+60;x+=23){ctx.beginPath();ctx.moveTo(x,o.y+20);ctx.lineTo(x+30,o.y-20);ctx.stroke()}ctx.restore();}}car(player.x,player.y,player.w,player.h,'#64e7d2',true);for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1;}
function show(title,message,button,line){$('title').textContent=title;$('message').textContent=message;$('start').textContent=button;$('overline').textContent=line;$('overlay').classList.remove('hidden')}
function start(){state='playing';player.x=210;obstacles=[];particles=[];distance=0;elapsed=0;spawn=.9;keys.clear();$('score').textContent='0000';$('overlay').classList.add('hidden');$('pause').textContent='暂停';last=performance.now()}
function pause(){if(state==='playing'){state='paused';keys.clear();drag=false;show('稍作休息','公路会等你，准备好了就继续。','继续驾驶 →','TAKE A BREATH');$('pause').textContent='继续'}else if(state==='paused'){state='playing';$('overlay').classList.add('hidden');$('pause').textContent='暂停';last=performance.now()}}
function crash(){state='over';keys.clear();drag=false;const score=Math.floor(distance),record=score>best;if(record){best=score;try{localStorage.setItem('neon-drive-best',String(best))}catch(e){}$('best').textContent=String(best).padStart(4,'0')}for(let i=0;i<36;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:1,color:i%2?'#6de9e0':'#ffb370'});show('旅程暂告一段落',`本次得分 ${score} · ${record?'刷新最高纪录！':'再来一次，挑战更远的路。'}`,'重新出发 →','END OF RUN');$('speed').textContent='● 等待重新出发';$('pause').textContent='暂停'}
function update(dt){if(state==='playing'){elapsed+=dt;const speed=Math.min(540,230+elapsed*4);offset+=speed*dt;distance+=speed*dt/18;let axis=(keys.has('right')?1:0)-(keys.has('left')?1:0);player.x=Math.max(69,Math.min(351,player.x+axis*340*dt));spawn-=dt;if(spawn<=0){const lane=Math.floor(Math.random()*3),isCar=Math.random()>.3;obstacles.push({x:lanes[lane],y:-90,w:isCar?40:65,h:isCar?72:30,type:isCar?'car':'barrier',color:['#9b88e8','#ef738f','#e7b85e'][Math.floor(Math.random()*3)]});spawn=Math.max(.7,1.22-elapsed*.008)+Math.random()*.2}for(const o of obstacles){o.y+=speed*dt;if(Math.abs(o.x-player.x)<(o.w+player.w)/2-5&&Math.abs(o.y-player.y)<(o.h+player.h)/2-6){crash();break}}obstacles=obstacles.filter(o=>o.y<700);$('score').textContent=String(Math.floor(distance)).padStart(4,'0');if(state==='playing')$('speed').textContent=`● ${Math.round(speed*.38)} km/h · 第 ${1+Math.floor(elapsed/15)} 阶段`}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt*1.7}particles=particles.filter(p=>p.life>0)}
function frame(now){let dt=Math.min((now-last)/1000,.035);last=now;update(dt);draw();requestAnimationFrame(frame)}
$('start').onclick=()=>state==='paused'?pause():start();$('pause').onclick=pause;
function direction(e){return ['ArrowLeft','a','A'].includes(e.key)?'left':['ArrowRight','d','D'].includes(e.key)?'right':null}
window.addEventListener('keydown',e=>{const d=direction(e);if(d){e.preventDefault();if(state==='playing')keys.add(d)}if(e.code==='Space'&&e.target.tagName!=='BUTTON'){e.preventDefault();if(!e.repeat)pause()}});window.addEventListener('keyup',e=>{const d=direction(e);if(d)keys.delete(d)});
for(const dir of ['left','right']){const b=$(dir);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);if(state==='playing')keys.add(dir)});for(const type of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(type,()=>keys.delete(dir))}
function move(e){if(drag&&state==='playing'){const r=canvas.getBoundingClientRect();player.x=Math.max(69,Math.min(351,(e.clientX-r.left)/r.width*W))}}canvas.addEventListener('pointerdown',e=>{if(state!=='playing')return;drag=true;canvas.setPointerCapture(e.pointerId);move(e)});canvas.addEventListener('pointermove',move);for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>drag=false);
window.addEventListener('blur',()=>{keys.clear();if(state==='playing')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='playing')pause()});requestAnimationFrame(frame);
})();
</script></body></html>
